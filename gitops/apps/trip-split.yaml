apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trip-split
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/ahmedoshelmy/platform-k8s.git
    targetRevision: main
    path: charts/trip-split
    helm:
      releaseName: trip-split
      valueFiles:
        - ../../environments/dev/trip-split.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: trip-split
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
