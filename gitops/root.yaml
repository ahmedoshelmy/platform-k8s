# App of apps: Argo CD syncs gitops/apps/, which declares one Application per workload.
# Apply once by hand (kubectl apply -n argocd -f gitops/root.yaml); after that, Git is the source of truth.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/ahmedoshelmy/platform-k8s.git
    targetRevision: main
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
