{{- if .Values.networkPolicy.enabled }}
# web: only the ingress controller may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tripsplit.fullname" . }}-web
  labels:
    {{- include "tripsplit.labels" (dict "ctx" $ "component" "web") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tripsplit.selectorLabels" (dict "ctx" $ "component" "web") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
      ports:
        - port: http
---
# api: only the ingress controller and the web pods (nginx proxies /api and /ws).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tripsplit.fullname" . }}-api
  labels:
    {{- include "tripsplit.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tripsplit.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
        - podSelector:
            matchLabels:
              {{- include "tripsplit.selectorLabels" (dict "ctx" $ "component" "web") | nindent 14 }}
      ports:
        - port: http
{{- end }}
