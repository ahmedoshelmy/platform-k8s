apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tripsplit.fullname" . }}-api
  labels:
    {{- include "tripsplit.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    {{- if .Values.api.scaleOutReady }}
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
    {{- else }}
    # One broker, one pod: never run two at once, even during a rollout.
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "tripsplit.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tripsplit.labels" (dict "ctx" $ "component" "api") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "tripsplit.serviceAccountName" . }}
      securityContext:
        {{- include "tripsplit.podSecurityContext" . | nindent 8 }}
        runAsUser: {{ .Values.api.runAsUser }}
        runAsGroup: {{ .Values.api.runAsUser }}
      {{- if .Values.waitForDatabase.enabled }}
      # Wait (bounded) until Postgres answers, so the API's first start does not crash-loop on DNS/connection errors.
      initContainers:
        - name: wait-for-database
          image: {{ .Values.waitForDatabase.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - for i in $(seq 1 90); do pg_isready -q -h "$DB_HOST" -p "$DB_PORT" && exit 0; sleep 2; done; echo "database not ready"; exit 1
          env:
            - { name: DB_HOST, value: {{ include "tripsplit.dbHost" . | quote }} }
            - { name: DB_PORT, value: {{ .Values.database.port | quote }} }
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 100m, memory: 32Mi }
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            {{- include "tripsplit.containerSecurityContext" . | nindent 12 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "tripsplit.fullname" . }}-api
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tripsplit.secretName" . }}
                  key: password
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Spring Boot's probe groups: liveness = the app itself, readiness = app + database.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "tripsplit.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
