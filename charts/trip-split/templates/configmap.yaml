apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tripsplit.fullname" . }}-api
  labels:
    {{- include "tripsplit.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
data:
  DATABASE_URL: "jdbc:postgresql://{{ include "tripsplit.dbHost" . }}:{{ .Values.database.port }}/{{ .Values.database.name }}{{ with .Values.database.extraParams }}?{{ . }}{{ end }}"
  DATABASE_USER: {{ .Values.database.username | quote }}
  TRIPSPLIT_DEMO_DATA: {{ .Values.config.demoData | quote }}
  ALLOWED_ORIGINS: "{{ .Values.config.allowedOrigins }}{{ if .Values.ingress.enabled }},http://{{ .Values.ingress.host }},https://{{ .Values.ingress.host }}{{ end }}"
  # The container's cgroup limit drives the heap size; serial GC suits a small pod.
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Djava.io.tmpdir=/tmp"
---
# The image's nginx listens on port 80, which needs root. This copy of the same rules listens on 8080 so the
# web pod can run as the unprivileged nginx user with a read-only root filesystem.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tripsplit.fullname" . }}-web
  labels:
    {{- include "tripsplit.labels" (dict "ctx" $ "component" "web") | nindent 4 }}
data:
  default.conf: |
    server {
        listen 8080;
        root /usr/share/nginx/html;

        location /api/ {
            proxy_pass http://{{ .Values.api.serviceName }}:8080;
            proxy_set_header Host $host;
        }

        location /ws {
            proxy_pass http://{{ .Values.api.serviceName }}:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 1h;
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            try_files $uri /index.html;
        }
    }
