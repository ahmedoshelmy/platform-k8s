apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tripsplit.fullname" . }}-web
  labels:
    {{- include "tripsplit.labels" (dict "ctx" $ "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "tripsplit.selectorLabels" (dict "ctx" $ "component" "web") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "tripsplit.labels" (dict "ctx" $ "component" "web") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "tripsplit.podSecurityContext" . | nindent 8 }}
        # nginx user in nginx:alpine; the mounted config listens on 8080, so no root is needed.
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- include "tripsplit.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /run }
            - { name: tmp, mountPath: /tmp }
            - { name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - name: conf
          configMap:
            name: {{ include "tripsplit.fullname" . }}-web
