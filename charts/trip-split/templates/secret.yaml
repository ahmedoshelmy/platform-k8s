{{- include "tripsplit.validate" . }}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tripsplit.secretName" . }}
  labels:
    {{- include "tripsplit.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "secrets.dbPassword is required when secrets.existingSecret is empty" .Values.secrets.dbPassword | quote }}
{{- end }}
