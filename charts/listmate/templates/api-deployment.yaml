apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "listmate.fullname" . }}-api
  labels:
    {{- include "listmate.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "listmate.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "listmate.labels" (dict "ctx" $ "component" "api") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pods when config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "listmate.serviceAccountName" . }}
      securityContext:
        {{- include "listmate.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "listmate.selectorLabels" (dict "ctx" $ "component" "api") | nindent 14 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "listmate.fullname" . }}-api
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "listmate.secretName" . }}
                  key: password
            # $(DB_PASSWORD) is expanded by the kubelet; the full string never sits in the ConfigMap.
            - name: ConnectionStrings__Postgres
              value: "Host={{ include "listmate.dbHost" . }};Port={{ .Values.database.port }};Database={{ .Values.database.name }};Username={{ .Values.database.username }};Password=$(DB_PASSWORD){{ with .Values.database.extraParams }};{{ . }}{{ end }}"
            {{- if .Values.redisBackplane.enabled }}
            - name: ConnectionStrings__Redis
              valueFrom:
                secretKeyRef:
                  name: {{ include "listmate.secretName" . }}
                  key: redis-connection
            {{- end }}
            {{- if .Values.config.seedDemoData }}
            - name: Listmate__DemoPassword
              valueFrom:
                secretKeyRef:
                  name: {{ include "listmate.secretName" . }}
                  key: demo-password
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Startup covers migrations; liveness checks the process only; readiness includes the database.
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "listmate.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
