{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "listmate.fullname" . }}
  labels:
    {{- include "listmate.labels" (dict "ctx" $ "component" "web") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # API and SignalR go straight to the API pods; everything else is the static web app.
          - path: /api
            pathType: Prefix
            backend:
              service: { name: {{ .Values.api.serviceName }}, port: { name: http } }
          - path: /hubs
            pathType: Prefix
            backend:
              service: { name: {{ .Values.api.serviceName }}, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ include "listmate.fullname" . }}-web, port: { name: http } }
{{- end }}
