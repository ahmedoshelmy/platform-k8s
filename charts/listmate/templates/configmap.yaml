apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "listmate.fullname" . }}-api
  labels:
    {{- include "listmate.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
data:
  Listmate__MigrateOnStartup: {{ .Values.api.migrateOnStartup | quote }}
  Listmate__SeedDemoData: {{ .Values.config.seedDemoData | quote }}
  Retention__ProcessedMutationDays: {{ .Values.config.mutationRetentionDays | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otlpEndpoint | quote }}
  ASPNETCORE_URLS: "http://+:8080"
  DOTNET_gcServer: "0"
  # appsettings never change inside an image; skipping the file watcher saves an inotify instance per pod
  # (busy nodes hit fs.inotify.max_user_instances and the API would crash on start).
  DOTNET_hostBuilder__reloadConfigOnChange: "false"
