{{- include "listmate.validate" . }}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "listmate.secretName" . }}
  labels:
    {{- include "listmate.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "secrets.dbPassword is required when secrets.existingSecret is empty" .Values.secrets.dbPassword | quote }}
  {{- if .Values.redisBackplane.enabled }}
  # abortConnect=false: keep retrying while Redis starts instead of crashing the pod.
  redis-connection: {{ printf "%s-redis:6379,abortConnect=false" .Release.Name | quote }}
  {{- end }}
  {{- with .Values.secrets.demoPassword }}
  demo-password: {{ . | quote }}
  {{- end }}
{{- end }}
