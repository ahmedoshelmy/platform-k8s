# Defaults are safe for a single-node dev cluster. Overlays live in environments/<env>/listmate.yaml.

api:
  image:
    repository: localhost/listmate-api
    tag: dev
    pullPolicy: IfNotPresent
  # The web image's nginx proxies /api and /hubs to http://api:8080, so the API Service must be called "api".
  # One release per namespace keeps that name unique.
  serviceName: api
  replicaCount: 1
  # Apply EF Core migrations when a pod starts. EF Core 9+ takes a database lock, so parallel replicas are safe.
  migrateOnStartup: true
  resources:
    requests: { cpu: 100m, memory: 160Mi }
    limits: { cpu: "1", memory: 256Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  extraEnv: []

web:
  image:
    repository: localhost/listmate-web
    tag: dev
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 200m, memory: 64Mi }

# Disruption budget for any tier that runs more than one pod.
podDisruptionBudget:
  minAvailable: 1

config:
  seedDemoData: false
  mutationRetentionDays: 30
  otlpEndpoint: ""

# Secret values. Placeholders only: real clusters set secrets.existingSecret (e.g. synced from Azure Key Vault)
# and the chart then creates no Secret. Keys: password, redis-connection, demo-password.
secrets:
  existingSecret: ""
  dbPassword: dev-only-change-me
  demoPassword: ""

database:
  # Empty = the in-cluster postgres subchart (<release>-postgres).
  host: ""
  port: 5432
  name: listmate
  username: listmate
  # Appended to the Npgsql connection string, e.g. "SSL Mode=Require" for a managed server.
  extraParams: ""

# Redis backplane for SignalR + shared Data Protection key ring. Required for more than one API replica.
redisBackplane:
  enabled: false

serviceAccount:
  create: true
  annotations: {}

podLabels: {}

ingress:
  enabled: true
  className: nginx
  host: listmate.localtest.me
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  tls: []

networkPolicy:
  enabled: true
  # Namespace of the ingress controller allowed to reach web and api.
  ingressControllerNamespace: ingress-nginx

# Subcharts (in-repo, see charts/postgres and charts/redis).
postgres:
  enabled: true
  auth:
    database: listmate
    username: listmate
  networkPolicy:
    allowFrom:
      app.kubernetes.io/name: listmate
      app.kubernetes.io/component: api

redis:
  enabled: false
  networkPolicy:
    allowFrom:
      app.kubernetes.io/name: listmate
      app.kubernetes.io/component: api
