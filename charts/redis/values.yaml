# In-memory Redis (no persistence): it only relays SignalR messages and holds the Data Protection key ring.
image:
  repository: docker.io/library/redis
  tag: 7-alpine
  pullPolicy: IfNotPresent

resources:
  requests: { cpu: 20m, memory: 32Mi }
  limits: { cpu: 250m, memory: 64Mi }

networkPolicy:
  enabled: true
  allowFrom: {}
